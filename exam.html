<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>اختبار القبول — مركز تمكين</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Cairo', 'Tahoma', sans-serif;
    background: #F4EEE1;
    color: #2E2718;
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
  }
  #root { min-height: 100%; }
  .ex-spin {
    width: 40px; height: 40px; border: 3px solid #E5DAC4;
    border-top-color: #785A2E; border-radius: 50%;
    animation: ex-rot 0.8s linear infinite;
  }
  @keyframes ex-rot { to { transform: rotate(360deg); } }
  @keyframes ex-pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .ex-rec-dot { animation: ex-pulse 1.4s ease-in-out infinite; }
  input, textarea, button, select { font-family: inherit; }
  textarea { resize: vertical; }
  .ex-fade { animation: ex-fade .4s ease both; }
  @keyframes ex-fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="root">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center">
    <div class="ex-spin"></div>
  </div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="env.js"></script>
<script src="src/supabase.js"></script>
<script type="text/babel" src="src/exam.jsx"></script>
</body>
</html>
